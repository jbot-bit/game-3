name: Crown Court Intel rendering root cause
on:
  workflow_dispatch:
    inputs:
      vulkan_only:
        description: Test alternate Intel graphics path only
        default: '0'
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ inputs.vulkan_only == '1' && fromJSON('["macos-15-intel"]') || fromJSON('["macos-15-intel", "macos-15"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: python3 crown-court/relay/diagnose-mac-rendering.py
        env:
          VULKAN_ONLY: ${{ inputs.vulkan_only }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-${{ matrix.runner }}
          path: |
            build/mac-render-diagnosis/*.json
            build/mac-render-diagnosis/*.log
            build/mac-render-diagnosis/*.png
