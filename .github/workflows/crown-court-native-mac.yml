name: Crown Court native Mac release audit
on:
  workflow_dispatch:
    inputs:
      runners:
        description: JSON runner list
        default: '["macos-15-intel", "macos-15"]'
permissions:
  contents: read
jobs:
  native-mac:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify and execute exact public Mac package
        run: python3 crown-court/relay/audit-native-mac.py
      - name: Install locked relay test dependency
        working-directory: crown-court/relay
        run: npm ci --ignore-scripts
      - name: Native Mac game data through live public relay
        env:
          GODOT_ENGINE: ${{ github.workspace }}/build/native-mac-audit/engine/Godot.app/Contents/MacOS/Godot
        run: >-
          node crown-court/relay/godot-test.mjs
          --pack "build/native-mac-audit/app/Crown Court.app/Contents/Resources/Crown Court.pck"
          --url wss://direct-metro.bnr.la/rooms
          --evidence build/native-mac-audit/public-rpc
      - name: Click-to-join through permanent server
        env:
          GODOT_ENGINE: ${{ github.workspace }}/build/native-mac-audit/engine/Godot.app/Contents/MacOS/Godot
        run: >-
          node crown-court/relay/discovery-test.mjs
          --pack "build/native-mac-audit/app/Crown Court.app/Contents/Resources/Crown Court.pck"
          --url wss://direct-metro.bnr.la/rooms
          --evidence build/native-mac-audit/discovery
      - name: Create easy-install disk image from verified app
        if: matrix.runner == 'macos-15'
        run: |
          ln -s /Applications build/native-mac-audit/app/Applications
          hdiutil create -fs HFS+ -volname "Crown Court" -srcfolder build/native-mac-audit/app -ov -format UDZO build/native-mac-audit/CrownCourt.dmg
          hdiutil verify build/native-mac-audit/CrownCourt.dmg
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'macos-15'
        with:
          name: CrownCourt-macOS-installer
          path: build/native-mac-audit/CrownCourt.dmg
      - name: Fail loudly if native startup failed
        run: |
          python3 -c 'import json; r=json.load(open("build/native-mac-audit/native-release.json")); assert all(c["passed"] for c in r["checks"].values()), r'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mac-${{ matrix.runner }}
          path: |
            build/native-mac-audit/*.json
            build/native-mac-audit/*.log
            build/native-mac-audit/public-rpc/*.json
            build/native-mac-audit/public-rpc/*.log
            build/native-mac-audit/discovery/*.json
            build/native-mac-audit/discovery/*.log
